[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jwave-dify-langchain"
version = "0.3.0"
description = "Dify 「仿真」workflow translated to LangChain / LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2,<2",
    "python-dotenv>=1.0",
    # 交互式 CLI（TUI）：可视化流水线、配置编辑器、历史记录
    "rich>=13.7",
    "prompt_toolkit>=3.0",
]

[project.optional-dependencies]
runtime = ["numpy>=1.26", "jwave>=0.2.1", "jax>=0.4", "jaxlib>=0.4", "jaxdf>=0.2.8", "matplotlib>=3.8"]
executors = ["ipykernel>=6", "mcp>=1.0", "python-mcp-server>=1.0"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.scripts]
jwave-flow = "jwave_flow.cli:main"
jwave-tui = "jwave_flow.tui:main"

[tool.setuptools]
packages = ["jwave_flow"]
