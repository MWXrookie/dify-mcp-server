<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dify MCP - 执行看板</title>
<style>
  :root { --bg: #0d1117; --surface: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --green: #3fb950; --red: #f85149; --yellow: #d2991d; --blue: #58a6ff; --accent: #1f6feb; --purple: #a371f7; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .top-bar h1 { font-size: 22px; font-weight: 600; }
  .top-bar h1 span { color: var(--muted); font-weight: 400; }
  .top-bar .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
  .top-bar .nav-links a { color: var(--muted); text-decoration: none; font-size: 13px; padding: 4px 10px; border: 1px solid var(--border); border-radius: 6px; }
  .top-bar .nav-links a:hover { border-color: var(--accent); color: var(--blue); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; min-width: 80px; text-align: center; }
  .stat .num { font-size: 22px; font-weight: 700; }
  .stat .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .stat.success .num { color: var(--green); }
  .stat.fail .num { color: var(--red); }
  .stat.timeout .num { color: var(--yellow); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; padding: 10px 14px; background: #1c2129; color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; position: sticky; top: 0; z-index: 1; }
  td { padding: 8px 14px; border-top: 1px solid var(--border); vertical-align: middle; }
  tr:hover { background: #1c2129; }
  .code-cell { max-width: 460px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: "SF Mono","Fira Code",monospace; font-size: 12px; color: var(--blue); cursor: pointer; }
  .code-cell:hover { color: #79c0ff; text-decoration: underline; }
  .code-cell .img-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-left:6px; vertical-align:middle; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .badge-ok { background: rgba(63,185,80,0.15); color: var(--green); }
  .badge-err { background: rgba(248,81,73,0.15); color: var(--red); }
  .badge-to { background: rgba(210,153,29,0.15); color: var(--yellow); }
  .time { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .dur { font-size: 13px; text-align: right; }
  .empty { text-align: center; padding: 48px; color: var(--muted); }
  .empty .icon { font-size: 40px; margin-bottom: 8px; }
  .detail-row { display: none; }
  .detail-row.open { display: table-row; }
  .detail-row td { padding: 0 14px 14px 14px; border-top: none; }
  .detail-box { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-size: 12px; font-family: "SF Mono","Fira Code",monospace; white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; }
  .detail-box.code { color: var(--blue); }
  .detail-box.stdout { color: var(--text); }
  .detail-box.stderr { color: var(--red); }
  .detail-tabs { display: flex; gap: 4px; margin-bottom: 8px; }
  .detail-tab { padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; border: 1px solid var(--border); background: transparent; color: var(--muted); }
  .detail-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .detail-section { display: none; }
  .detail-section.active { display: block; }
  .refresh { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 12px; }
  .refresh .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  @media (max-width: 768px) { body { padding: 12px; } .code-cell { max-width: 180px; } th:nth-child(1), td:nth-child(1) { display: none; } .dur { display: none; } }
</style>
</head>
<body>

<div class="top-bar">
  <h1>⚡ Dify MCP <span>- 执行看板</span></h1>
  <div class="nav-links">
    <a href="/">🏠 门户</a>
    <a href="/report">🧾 测试报告</a>
    <a href="/cache">🧠 纠错缓存</a>
    <a href="/demo">🎯 Demo</a>
  </div>
</div>

<div class="refresh"><span class="dot" id="live-dot"></span><span id="refresh-text">自动刷新中</span><span style="margin-left:16px;color:var(--red);cursor:pointer;font-size:12px" onclick="clearHistory()" title="清空所有执行历史">🗑 清空历史</span></div>

<div class="stats" id="stats">
  <div class="stat"><div class="num" id="stat-total">-</div><div class="label">总执行</div></div>
  <div class="stat success"><div class="num" id="stat-ok">-</div><div class="label">成功</div></div>
  <div class="stat fail"><div class="num" id="stat-fail">-</div><div class="label">失败</div></div>
  <div class="stat timeout"><div class="num" id="stat-to">-</div><div class="label">超时</div></div>
</div>

<div class="table-wrap" style="margin-top:16px">
  <table>
    <thead><tr>
      <th>#</th><th>时间</th><th>代码摘要</th><th>状态</th><th class="dur">耗时</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty"><div class="icon">📭</div>等待 Dify 发送第一条代码...</td></tr></tbody>
  </table>
</div>

<script>
var lastId = 0;
var firstLoad = true;

function timeAgo(ts) {
  var d = new Date(ts), now = new Date();
  var s = Math.floor((now - d) / 1000);
  var relative;
  if (s < 60) relative = s + "秒前";
  else if (s < 3600) relative = Math.floor(s/60) + "分钟前";
  else relative = Math.floor(s/3600) + "小时前";
  var dateStr = d.toLocaleString("zh-CN", { month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit" });
  return relative + " (" + dateStr + ")";
}

function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function smartSummary(code) {
  var lines = code.split("\n");
  var meaningful = '';
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    if (/^(import |from |#!|\/\/)/.test(line)) continue;
    meaningful = line;
    break;
  }
  // If nothing left (all imports), use the first non-empty line
  if (!meaningful && lines.length > 0) {
    for (var j = 0; j < lines.length; j++) {
      var l = lines[j].trim();
      if (l && !/^#!/.test(l)) { meaningful = l; break; }
    }
  }
  if (!meaningful) meaningful = lines[0] || '';
  // Truncate to 100 chars
  if (meaningful.length > 100) meaningful = meaningful.slice(0, 100) + '…';
  return meaningful;
}

function badge(exit, to) {
  if (to) return '<span class="badge badge-to">超时</span>';
  if (exit === 0) return '<span class="badge badge-ok">成功</span>';
  return '<span class="badge badge-err">失败 (' + exit + ')</span>';
}

function renderRow(r) {
  var dur = r.duration_ms != null ? (r.duration_ms < 1000 ? r.duration_ms+"ms" : (r.duration_ms/1000).toFixed(1)+"s") : "-";
  var hasImg = r.image_base64 && r.image_base64.length > 100;
  var summary = smartSummary(r.code || '');
  var imgDot = hasImg
    ? '<span class="img-dot" title="有图像" onclick="event.stopPropagation();showLightbox(\'data:image/png;base64,' + r.image_base64 + '\')"></span>'
    : '';

  return '<tr onclick="toggleDetail(' + r.id + ')" style="cursor:pointer">'
    + '<td style="color:var(--muted);font-size:12px">' + r.id + '</td>'
    + '<td class="time" title="' + r.timestamp + '">' + timeAgo(r.timestamp) + '</td>'
    + '<td class="code-cell">' + esc(summary) + imgDot + '</td>'
    + '<td>' + badge(r.exit_code, r.timed_out) + '</td>'
    + '<td class="dur">' + dur + '</td>'
    + '</tr>'
    + '<tr class="detail-row" id="detail-' + r.id + '"><td colspan="5">'
    + '<div class="detail-tabs">'
    + '<span class="detail-tab active" onclick="event.stopPropagation();switchTab(' + r.id + ',\'code\')">📝 代码</span>'
    + '<span class="detail-tab" onclick="event.stopPropagation();switchTab(' + r.id + ',\'stdout\')">📤 stdout</span>'
    + '<span class="detail-tab" onclick="event.stopPropagation();switchTab(' + r.id + ',\'stderr\')">📥 stderr</span>'
    + '</div>'
    + '<div class="detail-section active" id="sec-' + r.id + '-code"><div class="detail-box code">' + esc(r.code) + '</div></div>'
    + '<div class="detail-section" id="sec-' + r.id + '-stdout"><div class="detail-box stdout">' + (esc(r.stdout) || "(无输出)") + '</div></div>'
    + '<div class="detail-section" id="sec-' + r.id + '-stderr"><div class="detail-box stderr">' + (esc(r.stderr) || "(无输出)") + '</div></div>'
    + '</td></tr>';
}

function toggleDetail(id) { document.getElementById("detail-" + id).classList.toggle("open"); }

function switchTab(id, tab) {
  ["code","stdout","stderr"].forEach(function(t) { document.getElementById("sec-"+id+"-"+t).classList.toggle("active", t===tab); });
  var tabs = document.querySelectorAll("#detail-"+id+" .detail-tab");
  tabs.forEach(function(el,i) { el.classList.toggle("active", ["code","stdout","stderr"][i]===tab); });
}

async function refresh() {
  try {
    var resp = await fetch("/dashboard/api/executions?since=" + lastId + "&limit=100");
    var data = await resp.json();
    if (data.executions && data.executions.length > 0) {
      var rows = document.getElementById("rows");
      if (firstLoad) { rows.innerHTML = ""; firstLoad = false; }
      data.executions.slice().reverse().forEach(function(r) {
        if (document.getElementById("detail-"+r.id)) return;
        rows.insertAdjacentHTML("afterbegin", renderRow(r));
        lastId = Math.max(lastId, r.id);
      });
    }
    if (data.stats) {
      document.getElementById("stat-total").textContent = data.stats.total;
      document.getElementById("stat-ok").textContent = data.stats.success;
      document.getElementById("stat-fail").textContent = data.stats.failed;
      document.getElementById("stat-to").textContent = data.stats.timeout;
    }
    document.getElementById("live-dot").style.background = "var(--green)";
    document.getElementById("refresh-text").textContent = "自动刷新中";
  } catch(e) {
    document.getElementById("live-dot").style.background = "var(--red)";
    document.getElementById("refresh-text").textContent = "连接断开";
  }
}

document.addEventListener('click', function(e) {
  var img = e.target.closest('.gallery-thumb');
  if (!img) return;
  e.stopPropagation();
  showLightbox(img.src);
});

function showLightbox(src) {
  var old = document.getElementById('gallery-lightbox');
  if (old) old.remove();
  var lb = document.createElement('div');
  lb.id = 'gallery-lightbox';
  lb.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:pointer;';
  lb.onclick = function() { lb.remove(); };
  var inner = document.createElement('img');
  inner.src = src;
  inner.style.cssText = 'max-width:90%;max-height:90%;border-radius:8px;box-shadow:0 0 40px rgba(0,0,0,0.5);';
  lb.appendChild(inner);
  document.body.appendChild(lb);
  document.addEventListener('keydown', function escFn(ev) { if (ev.key === 'Escape') { lb.remove(); document.removeEventListener('keydown', escFn); } });
}

refresh();
setInterval(refresh, 3000);

async function clearHistory() {
  if (!confirm('确定要清空所有执行历史吗？此操作不可撤销。')) return;
  try {
    var resp = await fetch('/dashboard/api/executions', { method: 'DELETE' });
    var data = await resp.json();
    if (data.ok) {
      document.getElementById('rows').innerHTML = '<tr><td colspan="5" class="empty"><div class="icon">📭</div>已清空 ' + data.deleted + ' 条记录</td></tr>';
      document.getElementById('stat-total').textContent = '0';
      document.getElementById('stat-ok').textContent = '0';
      document.getElementById('stat-fail').textContent = '0';
      document.getElementById('stat-to').textContent = '0';
      lastId = 0;
      firstLoad = true;
    }
  } catch(e) {
    alert('清空失败: ' + e);
  }
}
</script>
</body>
</html>
